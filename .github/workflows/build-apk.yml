name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: APK ayar dosyası oluştur
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = Mesaj Uygulamam
          package.name = mesajuygulamam
          package.domain = org.mesajuygulamam

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json

          version = 1.0

          requirements = python3,kivy,websockets

          orientation = portrait

          fullscreen = 0

          android.permissions = INTERNET

          [buildozer]

          log_level = 2
          warn_on_root = 1
          EOF

      - name: APK oluştur
        run: |
          buildozer android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Mesaj-Uygulamam-APK
          path: bin/*.apk
