name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK lisanslarını kabul et
        run: |
          yes | sdkmanager --licenses || true

      - name: Android Build Tools 35 kur
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.36"

      - name: buildozer.spec oluştur
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = Mesaj Uygulamam
          package.name = mesajuygulamam
          package.domain = org.mesajuygulamam

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json

          version = 1.0

          requirements = python3,kivy,websockets

          orientation = portrait

          fullscreen = 0

          android.permissions = INTERNET

          android.api = 35
          android.minapi = 23

          [buildozer]

          log_level = 2
          warn_on_root = 1
          EOF

      - name: APK oluştur
        run: |
          buildozer android debug

      - name: APK'yı kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Mesaj-Uygulamam-APK
          path: bin/*.apk
